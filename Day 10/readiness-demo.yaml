apiVersion: v1
kind: ConfigMap
metadata:
  name: readiness-demo-code
data:
  server.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/ready":
                status = 503 if os.path.exists("/tmp/not-ready") else 200
            else:
                status = 200

            self.send_response(status)
            self.end_headers()
            self.wfile.write(str(status).encode())

    HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test ! -f /tmp/unhealthy
            periodSeconds: 2
            failureThreshold: 3
      volumes:
        - name: code
          configMap:
            name: readiness-demo-code

---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 8000