apiVersion: v1
kind: Pod
metadata:
  name: cpu-test
spec:
  containers:
    - name: cpu-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources: 
        requests:
          cpu: "1"
          memory: "64Mi"
        limits:
          cpu: "20"
          memory: "128Mi"